# Production web server for the dashboard (M10). Host network: listen on loopback only.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  # Writable paths for the unprivileged nginx user (/tmp is a tmpfs in Compose).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    # Explicit loopback bind: never a wildcard IPv4 or IPv6 listener.
    listen 127.0.0.1:8080;
    root /usr/share/nginx/html;

    # Readiness marker answered by this server itself, not the API.
    location = /healthz {
      default_type text/plain;
      return 200 "dashboard-web ok\n";
    }

    # Same-origin API proxy. No URI on proxy_pass keeps path and query unchanged;
    # API status codes, bodies and content types pass through (no error interception).
    # ^~ keeps the file rule below from claiming API paths with an extension.
    location = /api {
      proxy_pass http://127.0.0.1:8090;
    }
    location ^~ /api/ {
      proxy_pass http://127.0.0.1:8090;
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Files (anything with an extension) are served as-is or 404, never index.html.
    location ~ \.[A-Za-z0-9]+$ {
      try_files $uri =404;
    }

    # UI routes fall back to the Angular app.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
